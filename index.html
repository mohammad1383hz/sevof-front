<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sevof — AI SEO agent</title>
    <meta name="description" content="Sevof is an AI SEO agent that writes, publishes and refreshes SEO content for WordPress and Shopify sites in your site's language." />
    <style>
      /* Shown only for the moment the interface language is being chosen on a first visit. */
      #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
      #boot-loader span { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #cbd5e1; border-top-color: #5B47FB; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <div id="root"><div id="boot-loader" aria-hidden="true"><span></span></div></div>
    <!-- Runtime settings (API URL, Google Client ID), editable on the server without a rebuild. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
